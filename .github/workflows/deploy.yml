name: Deploy 

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Install sshpass
        run: sudo apt-get install sshpass

      - name: Deploy to remote server
        run: |
          sshpass -p ${{ secrets.SSH_PASSWORD }} ssh -p 2368 -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
          "cd /opt/projects/PokerTracker && git pull origin master && docker compose up -d --build > /dev/null 2>&1 < /dev/null &"